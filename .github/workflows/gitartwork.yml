name: gitartwork from a contribution graph

on:
  push:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    name: Make gitartwork SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: jasineri/gitartwork@v1
        with:
          user_name: foadroot
          text: FoaDRoot
      - uses: jasineri/simple-push-action@v1